app:
  log_level: "${LOG_LEVEL:-INFO}"
  window_title: "LocalExtract AI"
  max_gui_log_lines: 1000

ai:
  base_url: "${LOCAL_AI_BASE_URL:-http://127.0.0.1:8080/v1}"
  api_key: "${LOCAL_AI_API_KEY:-local}"
  model: "${LOCAL_AI_MODEL:-local-model}"
  timeout_seconds: 60

flows:
  extract_clipboard:
    prompt: >-
      识别图片中的房间信息。先定位由数字、英文字母和下划线组成的房间编号，
      再识别每个房间编号视觉上正上方、距离最近且属于同一信息块的中文名字。
      必须保持名字和房间编号的空间对应关系，并按图片从上到下、从左到右排序。
      每行只输出一组，格式严格为“中文名字<TAB>房间编号”，其中 <TAB> 必须使用
      一个真实的制表符。不要输出标题、解释、序号、Markdown、代码块或其他文字。
      无法确认对应中文名字的房间编号不要输出，不要猜测或组合不同信息块的内容。
    output_separator: "\n"
